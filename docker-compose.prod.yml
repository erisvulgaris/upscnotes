# UPSCbooks production compose — for the Dokploy server (176.100.37.236).
#   Host alloc: app on 3003 (free; 3000 dokploy, 3001/5000 neulabs).
#   Domain: upscnotes.shop via Traefik + Cloudflare.
# Deploy: docker compose -f docker-compose.prod.yml up -d --build
services:
  app:
    build: .
    image: upscotes:latest
    restart: unless-stopped
    container_name: upscotes-app
    ports:
      - "3003:3000"
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - upscotes-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  upscotes-data: